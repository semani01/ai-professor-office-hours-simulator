<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#1e1b4b"/>
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="7" fill="#a78bfa"/>
  <!-- Orbit 1 -->
  <ellipse cx="50" cy="50" rx="35" ry="13" stroke="#a78bfa" stroke-width="4.5" fill="none"/>
  <!-- Orbit 2 -->
  <ellipse cx="50" cy="50" rx="35" ry="13" stroke="#a78bfa" stroke-width="4.5" fill="none" transform="rotate(60 50 50)"/>
  <!-- Orbit 3 -->
  <ellipse cx="50" cy="50" rx="35" ry="13" stroke="#a78bfa" stroke-width="4.5" fill="none" transform="rotate(120 50 50)"/>
  <!-- Electron dots -->
  <circle cx="85" cy="50" r="6" fill="#a78bfa"/>
  <circle cx="33" cy="80" r="6" fill="#a78bfa"/>
  <circle cx="33" cy="20" r="6" fill="#a78bfa"/>
</svg>
